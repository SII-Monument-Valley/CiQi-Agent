[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ciqi-eval"
version = "0.1.0"
description = "Reproducible multimodal agent evaluation across OpenAI, Claude, Gemini, and pluggable tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "openai>=1.40.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]
hf = [
  "huggingface-hub>=1.0.0",
]

[project.scripts]
ciqi-eval = "ciqi_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ciqi_eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
